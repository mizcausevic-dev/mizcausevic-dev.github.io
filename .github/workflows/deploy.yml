name: Deploy career site to Pages (canonical-spliced)

# Triggers:
#   - push to main           → splice canonical + deploy
#   - daily schedule         → re-fetch apex canonical so career stats follow drift
#                              even without a code push to this repo
#   - manual dispatch        → on-demand re-splice
#
# Stat splice source: https://kineticgain.com/kinetic-gain-canonical.json
# (Public-served canonical — generated by mizcausevic-dev/kineticgain-com-apex
# and FTP-deployed to the apex root. The career site consumes the DEPLOYED
# contract, not the private build pipeline. Drift on apex → next apex deploy →
# next career deploy / schedule picks it up automatically.)
#
# This workflow REPLACES the legacy "Pages: deploy from branch" build.
# Pages source must be set to "GitHub Actions" (build_type=workflow) in repo settings.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'  # 06:17 UTC daily — picks up apex canonical drift
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout career site
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Fetch public apex canonical
        run: |
          set -euo pipefail
          mkdir -p /tmp/apex-canon
          # 5 retries, 30s timeout each — apex is FTP-deployed, occasional jitter is normal.
          curl --fail --show-error --silent --retry 5 --retry-delay 6 --max-time 30 \
            -H 'Accept: application/json' \
            -o /tmp/apex-canon/kinetic-gain-canonical.json \
            https://kineticgain.com/kinetic-gain-canonical.json
          echo "OK: fetched canonical ($(wc -c </tmp/apex-canon/kinetic-gain-canonical.json) bytes)"
          python3 -c "import json; d=json.load(open('/tmp/apex-canon/kinetic-gain-canonical.json')); print('  measured=', d.get('measured','?'), 'version=', d.get('version','?'))"

      - name: Splice canonical stats into index.html
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, pathlib

          canon = json.load(open("/tmp/apex-canon/kinetic-gain-canonical.json", encoding="utf-8"))

          # Canonical structure (mizcausevic-dev/kineticgain-com-apex/kinetic-gain-canonical.json):
          #   headline_stats.{v1_prod_count, archived_count, _v1prod_measured, _archived_measured}
          #   security_stats.{dependabot_repos, codeql_repos, scorecard_repos,
          #                   sha_pinned_uses_lines, measured}
          #   pulse_stats.{universe_size, measured}
          headline = canon["headline_stats"]
          sec      = canon["security_stats"]
          pulse    = canon["pulse_stats"]

          v1_prod          = headline["v1_prod_count"]
          v1_prod_measured = headline.get("_v1prod_measured", canon.get("updated", ""))
          archived          = headline["archived_count"]
          archived_measured = headline.get("_archived_measured", canon.get("updated", ""))

          pulse_size     = pulse["universe_size"]
          pulse_measured = pulse.get("measured", canon.get("updated", ""))

          deps          = sec["dependabot_repos"]
          ql            = sec["codeql_repos"]
          sc            = sec["scorecard_repos"]
          sha           = sec["sha_pinned_uses_lines"]
          sec_measured  = sec.get("measured", canon.get("updated", ""))

          # Pulse universe pretty-formats with thousands separator (matches apex output).
          pulse_fmt = f"{pulse_size:,}"

          # Equivalent of apex generate.py output, condensed for inline single-line splice.
          PAYLOADS = {
              "v1-prod-count":
                  f'<span class="kg-v1prod-num" data-measured="{v1_prod_measured}">{v1_prod}</span>',
              "archived-count":
                  f'<span class="kg-archived-num" data-measured="{archived_measured}">{archived}</span>',
              "pulse-universe-count":
                  f'<span class="kg-pulse-universe" data-measured="{pulse_measured}">{pulse_fmt}</span>',
              # Security-stats: same prose shape as apex security-stats-inline.md but
              # already in HTML (skips the MD->HTML transform step).
              "security-stats-inline":
                  f'Dependabot on <strong>{deps} repos</strong> · '
                  f'CodeQL on <strong>{ql}</strong> · '
                  f'OpenSSF Scorecard on <strong>{sc}</strong> (strict subset of CodeQL) · '
                  f'SHA-pinned actions across <strong>{sha} <code>uses:</code> lines</strong> '
                  f'(measured {sec_measured}).',
          }

          target = pathlib.Path("index.html")
          src = target.read_text(encoding="utf-8")

          for key, payload in PAYLOADS.items():
              begin_prefix = f"<!-- BEGIN GENERATED {key}"
              end_marker   = f"<!-- END GENERATED {key} -->"
              i = src.find(begin_prefix)
              j = src.find(end_marker, i)
              if i < 0 or j < 0:
                  raise SystemExit(f"FAIL: markers missing for '{key}' — begin_idx={i} end_idx={j}")
              i_end_of_begin = src.find("-->", i) + len("-->")
              # Inline single-line splice — no \n, no end-indent — paragraph stays one line.
              src = src[:i_end_of_begin] + payload + src[j:]
              print(f"OK: spliced {len(payload)} bytes for '{key}'")

          target.write_text(src, encoding="utf-8", newline="\n")
          print(f"OK: wrote {target} ({len(src)} bytes total)")
          PY

      - name: Fingerprint check (fail-fast if splice silently dropped)
        run: |
          set -euo pipefail
          for cls in kg-v1prod-num kg-archived-num kg-pulse-universe; do
            if ! grep -q "class=\"$cls\"" index.html; then
              echo "FAIL: expected class '$cls' not present after splice"
              exit 1
            fi
            echo "OK: '$cls' present in index.html"
          done
          # security-stats-inline has no class wrapper — check for the canonical
          # "Dependabot on <strong>" phrasing produced by the splice.
          if ! grep -q "Dependabot on <strong>" index.html; then
            echo "FAIL: security-stats-inline splice did not produce '<strong>' HTML"
            exit 1
          fi
          echo "OK: security-stats-inline HTML present"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
